<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ของพี่อัศ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&family=Noto+Serif+Thai:wght@600;700&display=swap" rel="stylesheet">
<style>
  /* ---------- Base ---------- */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: "Noto Sans Thai", system-ui, sans-serif;
    color: #3a2a1e;
    min-height: 100vh;
    /* white at the top -> orange at the bottom */
    background: linear-gradient(to bottom, #ffffff 0%, #ffd9a8 50%, #ff9a2e 100%);
    background-attachment: fixed;
  }
  .page { display: none; }
  .page.active { display: block; animation: fadeIn .6s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  /* Shown when a picture file is missing, so you can see what to add */
  .missing {
    display: flex; align-items: center; justify-content: center; text-align: center;
    background: repeating-linear-gradient(45deg, #fff3e3, #fff3e3 12px, #ffe3c2 12px, #ffe3c2 24px);
    color: #a05a10; font-size: .9rem; padding: 1rem;
  }

  /* ---------- Page 1 : intro ---------- */
  #intro {
    min-height: 100vh;
    flex-direction: column; align-items: center; justify-content: center;
    padding: 2rem 1rem;
  }
  #intro.active { display: flex; }
  .hero {
    position: relative;
    width: min(420px, 90vw);
    aspect-ratio: 3 / 4;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 14px 40px rgba(180, 90, 0, .35);
    border: 4px solid #fff;
  }
  .hero img, .hero .missing { width: 100%; height: 100%; object-fit: cover; display: block; }
  .hero-title {
    text-align: center;
    font-family: "Noto Serif Thai", serif;
    font-size: clamp(2rem, 8vw, 3rem);
    color: #d65a00;
    margin-bottom: 1.2rem;
    text-shadow: 0 2px 8px rgba(255,255,255,.8);
  }
  .btn {
    border: none; cursor: pointer; font-family: inherit; font-weight: 600;
    border-radius: 999px; color: #fff; transition: transform .15s, box-shadow .15s, background .15s;
  }
  .btn:active { transform: scale(.96); }
  #pressBtn {
    margin-top: 1.6rem;
    background: #1e6fff;
    font-size: 1.2rem; padding: .85rem 3rem;
    box-shadow: 0 6px 18px rgba(30, 111, 255, .45);
  }
  #pressBtn:hover { background: #1558d6; transform: translateY(-2px); }

  /* ---------- Page 2 : wiki style ---------- */
  #story { padding: 1.5rem 1rem 4rem; }
  .wiki {
    max-width: 820px; margin: 0 auto;
    background: rgba(255,255,255,.93);
    border: 1px solid #e6c9a4;
    border-radius: 14px;
    box-shadow: 0 10px 30px rgba(150, 80, 0, .2);
    overflow: hidden;
  }
  .wiki-header {
    background: linear-gradient(135deg, #ff9a2e, #ff6a00);
    color: #fff; padding: 1.4rem 1.6rem;
  }
  .wiki-header small { opacity: .85; letter-spacing: .08em; text-transform: uppercase; font-size: .75rem; }
  .wiki-header h1 { font-family: "Noto Serif Thai", serif; font-size: 2rem; margin-top: .2rem; }
  .wiki-body { padding: 1.4rem 1.6rem 2rem; line-height: 1.9; }
  .wiki-body h2 {
    font-family: "Noto Serif Thai", serif;
    font-size: 1.4rem; margin: 1.8rem 0 .8rem;
    padding-bottom: .3rem; border-bottom: 2px solid #ffb25e; color: #b34700;
  }
  .infobox {
    float: right; width: 230px; margin: 0 0 1rem 1.2rem;
    background: #fff8ee; border: 1px solid #e6c9a4; border-radius: 10px;
    font-size: .88rem; overflow: hidden;
  }
  .infobox .ib-title { background: #ffb25e; text-align: center; font-weight: 700; padding: .5rem; color: #4a2300; }
  .infobox table { width: 100%; border-collapse: collapse; }
  .infobox td { padding: .35rem .6rem; border-top: 1px solid #f0dcc0; vertical-align: top; }
  .infobox td:first-child { font-weight: 600; width: 38%; color: #8a4a10; }
  .toc {
    display: inline-block; background: #fff8ee; border: 1px solid #e6c9a4;
    border-radius: 10px; padding: .7rem 1.2rem; margin: .8rem 0; font-size: .92rem;
  }
  .toc strong { display: block; margin-bottom: .3rem; }
  .toc a { color: #b34700; text-decoration: none; display: block; }
  .toc a:hover { text-decoration: underline; }
  .intro-text { font-size: 1.1rem; }

  /* the picture + text that changes */
  .chapter {
    clear: both;
    margin: 1.6rem auto 0; text-align: center;
  }
  .chapter figure {
    width: min(380px, 100%); aspect-ratio: 1 / 1; margin: 0 auto;
    border-radius: 14px; overflow: hidden; border: 3px solid #ffb25e;
    box-shadow: 0 8px 22px rgba(150, 80, 0, .25);
    transition: opacity .35s ease;
  }
  .chapter figure.wide { aspect-ratio: 4 / 3; width: min(520px, 100%); }
  .chapter figure img, .chapter figure .missing { width: 100%; height: 100%; object-fit: cover; display: block; }
  .chapter figcaption, .chapter .chapter-text {
    margin-top: 1rem; font-size: 1.15rem; transition: opacity .35s ease;
  }
  .chapter .chapter-text.final {
    text-align: left; background: #fff3e3; border-left: 5px solid #ff9a2e;
    padding: 1rem 1.2rem; border-radius: 0 12px 12px 0; font-size: 1.05rem;
  }
  .fade { opacity: 0; }
  #nextBtn {
    margin-top: 1.2rem; background: #ff7a00; font-size: 1.05rem; padding: .75rem 2rem;
    box-shadow: 0 6px 16px rgba(255, 122, 0, .4);
  }
  #nextBtn:hover { background: #e06a00; transform: translateY(-2px); }
  .footer-note { text-align: center; margin-top: 2rem; font-size: .85rem; color: #a05a10; }

  /* music toggle */
  #musicBtn {
    position: fixed; right: 14px; bottom: 14px; z-index: 10; display: none;
    width: 46px; height: 46px; font-size: 1.3rem; background: #1e6fff;
    box-shadow: 0 4px 12px rgba(0,0,0,.3);
  }

  @media (max-width: 600px) {
    .infobox { float: none; width: 100%; margin: 0 0 1rem; }
  }
</style>
</head>

      text: "สุดท้ายนี้อยากบอกเทอว่า ขอบคุณที่เข้ามาในชีวิตเค้านะคะ เทอเป็นคนที่ตั้งใจเป็นคนที่ขยัน เทอชอบทำตัวน่ารักๆ เรามีทะเลาะกันบ้างแต่ก็ยังรักกันอยู่ แฟนก็ใจเย็นๆกับเค้าด้วยน้า เค้ารักเทอนะคะ ไม่หนีเทอไปไหนแน่ๆ" }
  ];
  let current = 0;

  const fig = document.getElementById("chapterFig");
  const textEl = document.getElementById("chapterText");
  const nextBtn = document.getElementById("nextBtn");
  const bgm = document.getElementById("bgm");
  const musicBtn = document.getElementById("musicBtn");

  // If a picture is missing, show a clear placeholder instead of a broken icon
  function fallback(img, path) {
    const d = document.createElement("div");
    d.className = "missing";
    d.style.width = "100%"; d.style.height = "100%";
    d.textContent = "ใส่รูปที่นี่: " + path;
    img.replaceWith(d);
  }

  function showStep(i, animate = true) {
    const s = steps[i];
    const apply = () => {
      fig.innerHTML = "";
      fig.classList.toggle("wide", !!s.final);
      const img = document.createElement("img");
      img.src = s.img; img.alt = s.alt;
      img.onerror = () => fallback(img, s.img);
      fig.appendChild(img);
      textEl.textContent = s.text;
      textEl.classList.toggle("final", !!s.final);
      nextBtn.style.display = s.final ? "none" : "inline-block";
      fig.classList.remove("fade"); textEl.classList.remove("fade");
    };
    if (!animate) return apply();
    fig.classList.add("fade"); textEl.classList.add("fade");
    setTimeout(apply, 350);
  }

  // ---------- Page 1 -> Page 2 ----------
  document.getElementById("pressBtn").addEventListener("click", () => {
    document.getElementById("intro").classList.remove("active");
    document.getElementById("story").classList.add("active");
    window.scrollTo(0, 0);
    showStep(0, false);

    // Browsers only allow music after a click, so it starts here
    bgm.volume = 0.5;
    bgm.play().then(() => { musicBtn.style.display = "block"; })
              .catch(() => { /* no music file yet - that's okay */ });
  });

  // ---------- "กดเพื่อดูต่อ" ----------
  nextBtn.addEventListener("click", () => {
    if (current < steps.length - 1) { current++; showStep(current); }
  });

  // ---------- Music on/off ----------
  musicBtn.addEventListener("click", () => {
    if (bgm.paused) { bgm.play(); musicBtn.textContent = "🔊"; }
    else { bgm.pause(); musicBtn.textContent = "🔇"; }
  });
</script>
